
  
    <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dr. Care Clinic | Professional Healthcare</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

html{
  scroll-behavior:smooth;
}

body{
  background:#f4f9fc;
  color:#17324d;
}

/* NAVBAR */

nav{
  background:white;
  padding:18px 7%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:1000;
  box-shadow:0 2px 15px rgba(0,0,0,0.08);
}

.logo{
  font-size:22px;
  font-weight:bold;
  color:#17324d;
}

.logo span{
  color:#168aad;
}

nav a{
  text-decoration:none;
  color:#17324d;
  margin-left:18px;
  font-size:14px;
  font-weight:bold;
}

/* HERO */

.hero{
  min-height:650px;
  padding:70px 7%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:40px;
  background:linear-gradient(135deg,#e8f8fc,#ffffff);
}

.hero-content{
  max-width:600px;
}

.badge{
  display:inline-block;
  background:#d5f3fa;
  color:#08708c;
  padding:9px 16px;
  border-radius:25px;
  font-weight:bold;
  margin-bottom:20px;
}

.hero h1{
  font-size:52px;
  line-height:1.1;
  margin-bottom:20px;
}

.hero h1 span{
  color:#168aad;
}

.hero p{
  font-size:18px;
  line-height:1.7;
  color:#5c7080;
  margin-bottom:28px;
}

.btn{
  display:inline-block;
  padding:14px 22px;
  border-radius:8px;
  text-decoration:none;
  font-weight:bold;
  margin-right:8px;
  margin-bottom:10px;
}

.primary{
  background:#168aad;
  color:white;
}

.secondary{
  background:white;
  color:#168aad;
  border:2px solid #168aad;
}

/* DOCTOR HERO CARD */

.hero-doctor{
  width:330px;
  min-height:370px;
  background:white;
  border-radius:25px;
  box-shadow:0 15px 40px rgba(0,0,0,0.12);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:30px;
}

.doctor-circle{
  width:190px;
  height:190px;
  border-radius:50%;
  background:linear-gradient(135deg,#d9f5fb,#a9e3ef);
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:95px;
  margin-bottom:20px;
}

.hero-doctor h2{
  margin-bottom:8px;
}

.hero-doctor p{
  margin:0;
  font-size:15px;
  color:#168aad;
}

/* GENERAL SECTIONS */

section{
  padding:75px 7%;
}

.title{
  text-align:center;
  font-size:34px;
  margin-bottom:12px;
}

.subtitle{
  text-align:center;
  color:#687b8c;
  margin-bottom:40px;
}

/* SERVICES */

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:24px;
}

.card{
  background:white;
  padding:30px 22px;
  border-radius:15px;
  text-align:center;
  box-shadow:0 7px 25px rgba(0,0,0,0.07);
  transition:0.3s;
}

.card:hover{
  transform:translateY(-5px);
}

.icon{
  font-size:45px;
  margin-bottom:15px;
}

.card h3{
  margin-bottom:12px;
}

.card p{
  color:#687b8c;
  line-height:1.6;
}

/* DOCTOR */

.doctor-section{
  background:white;
}

.doctor-box{
  max-width:900px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:30px;
  background:#f4f9fc;
  padding:35px;
  border-radius:18px;
}

.doctor-photo{
  width:170px;
  height:170px;
  flex-shrink:0;
  border-radius:50%;
  background:#d9f5fb;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:80px;
}

.doctor-info h3{
  font-size:28px;
  margin-bottom:8px;
}

.doctor-info .speciality{
  color:#168aad;
  font-weight:bold;
  margin-bottom:12px;
}

.doctor-info p{
  color:#687b8c;
  line-height:1.7;
}

/* TIMINGS */

.timing{
  max-width:650px;
  margin:auto;
  background:white;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 7px 25px rgba(0,0,0,0.07);
}

.time-row{
  display:flex;
  justify-content:space-between;
  padding:19px 23px;
  border-bottom:1px solid #eeeeee;
}

.time-row:last-child{
  border-bottom:none;
}

/* APPOINTMENT */

.appointment{
  background:#e8f8fc;
}

.appointment-box{
  max-width:700px;
  margin:auto;
  background:white;
  padding:35px;
  border-radius:18px;
  box-shadow:0 7px 25px rgba(0,0,0,0.07);
}

input,
textarea{
  width:100%;
  padding:14px;
  margin-bottom:14px;
  border:1px solid #d8e3e9;
  border-radius:8px;
  outline:none;
  font-size:15px;
}

textarea{
  min-height:100px;
  resize:vertical;
}

.whatsapp{
  width:100%;
  border:none;
  padding:15px;
  border-radius:8px;
  background:#25D366;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

/* CONTACT */

.contact-box{
  max-width:800px;
  margin:auto;
  text-align:center;
}

.contact-item{
  background:white;
  padding:20px;
  margin:12px 0;
  border-radius:10px;
  box-shadow:0 5px 18px rgba(0,0,0,0.06);
}

.contact-item strong{
  display:block;
  margin-bottom:6px;
}

/* FOOTER */

footer{
  background:#17324d;
  color:white;
  text-align:center;
  padding:30px;
}

footer p{
  margin:6px;
}

/* MOBILE */

  }

  nav a{

    font-size:12px;
  }

  }
