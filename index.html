<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Delicious Bites | Restaurant</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#111;
  color:white;
}

nav{
  background:#1c1c1c;
  padding:18px 8%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:24px;
  font-weight:bold;
}

nav a{
  color:white;
  text-decoration:none;
  margin-left:18px;
}

.hero{
  min-height:75vh;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:30px;
  background:linear-gradient(#0008,#0008),
  url("https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&w=1400&q=80")
  center/cover;
}

.hero h1{
  font-size:48px;
  margin-bottom:15px;
}

.hero p{
  font-size:20px;
  margin-bottom:25px;
}

.btn{
  display:inline-block;
  background:#25D366;
  color:white;
  padding:13px 22px;
  border-radius:25px;
  text-decoration:none;
  font-weight:bold;
}

section{
  padding:55px 8%;
}

.title{
  text-align:center;
  font-size:32px;
  margin-bottom:35px;
}

.menu{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:25px;
}

.card{
  background:#1d1d1d;
  border-radius:15px;
  overflow:hidden;
  padding-bottom:20px;
  text-align:center;
}

.card img{
  width:100%;
  height:180px;
  object-fit:cover;
}

.card h3{
  margin:15px 0 8px;
}

.price{
  font-size:19px;
  margin-bottom:12px;
}

.order-btn{
  border:none;
  background:#25D366;
  color:white;
  padding:10px 18px;
  border-radius:20px;
  cursor:pointer;
  font-weight:bold;
}

.order-box{
  max-width:600px;
  margin:auto;
  background:#1d1d1d;
  padding:25px;
  border-radius:15px;
}

input{
  width:100%;
  padding:13px;
  margin:8px 0;
  border:none;
  border-radius:8px;
}

#orderList{
  margin:20px 0;
  line-height:1.8;
}

.total{
  font-size:22px;
  font-weight:bold;
  margin:15px 0;
}

.whatsapp{
  width:100%;
  border:none;
  padding:14px;
  background:#25D366;
  color:white;
  border-radius:25px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.about{
  text-align:center;
  max-width:800px;
  margin:auto;
  line-height:1.7;
}

footer{
  text-align:center;
  background:#1c1c1c;
  padding:25px;
  margin-top:30px;
}

@media(max-width:600px){
  .hero h1{
    font-size:36px;
  }

  nav{
    padding:15px 5%;
  }

  nav a{
    margin-left:8px;
    font-size:14px;
  }
}
</style>
</head>

<body>

<nav>
  <div class="logo">🍴 Delicious Bites</div>

  <div>
    <a href="#home">Home</a>
    <a href="#menu">Menu</a>
    <a href="#order">Order</a>
  </div>
</nav
